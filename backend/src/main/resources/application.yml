spring:
  application:
    name: CodeClassroom Backend
  datasource:
    url: jdbc:postgresql://localhost:5432/codeclassroom
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970} # 256-bit secret key fallback
      expiration: 86400000 # 24 hours
